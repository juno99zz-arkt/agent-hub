<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI 허브">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Juno Agent Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0e14; --surface:#151a23; --surface-2:#1a2130;
    --line:#1e2530; --line-2:#2b3445;
    --text:#f2f5fa; --muted:#9aa4b4; --dim:#5f6b7e;
    --accent:#58a6ff; --accent-soft:rgba(88,166,255,.12);
    --ok:#3fb950; --warn:#d29922; --err:#f85149; --idle:#6e7781;
    color-scheme: dark;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"Noto Sans KR",-apple-system,"Segoe UI",sans-serif;
       letter-spacing:-.014em;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;color:inherit}
  .container{max-width:1360px;margin:0 auto;padding:0 32px}

  /* header */
  header{position:sticky;top:0;z-index:10;background:rgba(11,14,20,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:56px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:15px}
  .nav-right{display:flex;align-items:center;gap:18px;font-size:13px;color:var(--muted)}
  .nav-right a:hover{color:var(--text)}

  /* title + toolbar */
  .head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:28px 0 18px}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.3em;color:var(--accent);text-transform:uppercase}
  h1{font-size:28px;font-weight:900;letter-spacing:-.02em;margin-top:6px}
  .summary{display:flex;gap:16px;font-size:13px;color:var(--muted)}
  .summary b{color:var(--text);font-weight:700}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
  .search{position:relative;flex:1 1 260px;max-width:360px}
  .search input{width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:999px;padding:8px 40px 8px 16px;color:var(--text);font:400 13.5px "Noto Sans KR",sans-serif;outline:none}
  .search input:focus{border-color:var(--accent)}
  .search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:600 11px ui-monospace,monospace;color:var(--dim);border:1px solid var(--line-2);border-radius:5px;padding:0 6px}
  .seg{display:flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;gap:2px}
  .seg button{border:0;background:none;border-radius:999px;padding:5px 14px;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px}
  .seg button:hover{color:var(--text)}
  .seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
  .spacer{flex:1}
  .icon-btn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line-2);border-radius:9px;background:none;cursor:pointer;color:var(--muted)}
  .icon-btn:hover{color:var(--text);border-color:var(--accent)}
  .icon-btn.spin svg{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* status dot */
  .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--idle)}
  .dot.run{background:var(--ok)} .dot.err{background:var(--err)} .dot.paused{background:var(--warn)}
  .dot.unknown{background:transparent;border:1.5px solid var(--dim)}
  .dot.live{box-shadow:0 0 0 0 rgba(63,185,80,.6);animation:pulse 1.6s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 6px rgba(63,185,80,0)}100%{box-shadow:0 0 0 0 rgba(63,185,80,0)}}

  /* compact grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
  .card{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 10px 11px 14px;cursor:pointer;min-height:64px;transition:border-color .15s,background .15s}
  .card:hover,.card:focus-visible{border-color:var(--line-2);background:var(--surface-2);outline:none}
  .card.sel{border-color:var(--accent)}
  .card .body{flex:1;min-width:0}
  .card .name{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
  .card .name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .times{font-size:11.5px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .times b{color:var(--muted);font-weight:500}
  .acts{display:flex;gap:4px;flex:none}
  .act{width:28px;height:28px;display:grid;place-items:center;border-radius:7px;border:1px solid transparent;background:none;cursor:pointer;color:var(--muted)}
  .act:hover{color:var(--accent);border-color:var(--line-2);background:var(--bg)}
  .act[disabled]{opacity:.25;cursor:default;pointer-events:none}

  /* list view */
  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:760px}
  th{text-align:left;font-size:11.5px;font-weight:700;color:var(--dim);letter-spacing:.04em;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
  td{padding:9px 14px;border-bottom:1px solid var(--line);color:var(--muted);white-space:nowrap}
  tr:last-child td{border-bottom:0}
  tbody tr{cursor:pointer}
  tbody tr:hover td{background:var(--surface)}
  tbody tr.sel td{background:var(--accent-soft)}
  td.nm{color:var(--text);font-weight:700}
  .st{display:inline-flex;align-items:center;gap:7px}
  .num{font:600 11px ui-monospace,monospace;color:var(--dim)}

  .empty{display:none;color:var(--dim);padding:40px 0;text-align:center;font-size:14px}
  .note{margin:22px 0 32px;font-size:12px;color:var(--dim);display:flex;gap:18px;flex-wrap:wrap}
  .note .st{gap:6px}
  code{font:12px ui-monospace,Consolas,monospace;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--muted)}

  /* side panel */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
  .scrim.open{opacity:1;pointer-events:auto}
  aside{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100%;background:var(--surface);border-left:1px solid var(--line-2);z-index:21;
        transform:translateX(100%);transition:transform .25s ease;overflow-y:auto;padding:22px 24px 32px}
  aside.open{transform:none}
  .p-top{display:flex;justify-content:space-between;align-items:center}
  .k{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--accent)}
  aside h2{font-size:22px;font-weight:900;letter-spacing:-.02em;margin:8px 0 6px}
  .badge{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;border:1px solid var(--line-2);border-radius:999px;padding:3px 10px}
  aside p.desc{font-size:14px;color:var(--muted);margin:14px 0}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:11.5px;color:var(--muted);border:1px solid var(--line-2);border-radius:6px;padding:1px 8px}
  .p-sec{margin-top:24px}
  .p-sec h3{font-size:11.5px;font-weight:700;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
  .btns{display:flex;flex-wrap:wrap;gap:8px}
  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);border-radius:9px;padding:7px 12px;font-size:13px;font-weight:700;background:none;cursor:pointer}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#0b0e14}
  .btn.primary:hover{color:#0b0e14;filter:brightness(1.1)}
  dl{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;font-size:13px}
  dt{color:var(--dim)} dd{color:var(--text)}
  .log{list-style:none;font-size:12.5px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .log li{display:flex;align-items:center;gap:9px;padding:8px 12px;border-bottom:1px solid var(--line)}
  .log li:last-child{border-bottom:0}
  .log .w{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
  .log time{color:var(--dim);font-variant-numeric:tabular-nums}
  .log a:hover .w{color:var(--accent)}
  .muted{font-size:12.5px;color:var(--dim)}
  .close{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line-2);background:none;cursor:pointer;color:var(--muted)}
  .close:hover{color:var(--text)}

  .toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:var(--surface-2);border:1px solid var(--line-2);border-radius:10px;padding:10px 16px;font-size:13.5px;transition:.25s;pointer-events:none;z-index:30}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (prefers-reduced-motion:reduce){aside,.scrim,.toast{transition:none}.dot.live,.icon-btn.spin svg{animation:none}}
  .brand .ko,.grab{display:none}

  /* ── 휴대폰: 앱처럼 보이는 전용 화면 (탭=열기, ⋯=상세 시트) ── */
  @media (max-width:760px){
    body{padding-bottom:calc(24px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
    header{padding-top:env(safe-area-inset-top)}
    .container{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
    .nav{height:52px}
    .brand .en{display:none}
    .brand .ko{display:inline;font-size:16px}
    .nav-right a{display:none}
    #updated{font-size:11px}
    .head{padding:16px 0 10px}
    .head .eyebrow,.head h1{display:none}
    .summary{gap:14px;font-size:12.5px}
    .toolbar{gap:8px;margin-bottom:12px}
    .search{max-width:none;flex:1 1 100%}
    .search input{font-size:16px;padding:11px 16px;border-radius:14px}
    .search kbd,.spacer,.lbl,.hint{display:none}
    #statusFilter{flex:1;min-width:0}
    #statusFilter button{flex:1;justify-content:center;padding:8px 4px;font-size:13.5px}
    #viewToggle button{padding:8px 12px}
    .icon-btn{width:42px;height:42px;border-radius:12px}

    .av{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:23px;flex:none;
        background:var(--surface-2);background:color-mix(in srgb,var(--c) 18%,var(--surface));
        border:1px solid var(--line-2);border-color:color-mix(in srgb,var(--c) 35%,var(--line))}
    .name{display:flex;align-items:center;gap:8px;font-weight:700}
    .info{width:44px;height:44px;border:0;background:none;border-radius:12px;display:grid;place-items:center;color:var(--dim);cursor:pointer;flex:none}
    .info:active{background:var(--bg);color:var(--text)}

    .rows{display:flex;flex-direction:column;gap:8px}
    .row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 6px 10px 10px;min-height:68px;cursor:pointer;touch-action:manipulation;transition:transform .1s,background .1s}
    .row .body{flex:1;min-width:0}
    .row .name{font-size:15.5px}
    .row .name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .row .times{font-size:12.5px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .row .times b{color:var(--muted);font-weight:500}

    .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 6px 12px;cursor:pointer;text-align:center;touch-action:manipulation;transition:transform .1s,background .1s}
    .tile .av{width:54px;height:54px;font-size:27px;border-radius:15px}
    .tile .info{position:absolute;top:0;right:0;width:38px;height:38px}
    .tile .name{justify-content:center;gap:6px;font-size:13px;line-height:1.3;min-height:34px;width:100%}
    .tile .name span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all}
    .tile .name .dot{position:absolute;top:14px;left:14px}
    .row:active,.tile:active{background:var(--surface-2);transform:scale(.985)}

    .note{margin:18px 0 8px;gap:10px 16px}

    /* 상세 패널 → 아래에서 올라오는 시트 */
    aside{top:auto;left:0;right:0;width:100%;max-height:88dvh;border-left:0;border-top:1px solid var(--line-2);border-radius:22px 22px 0 0;transform:translateY(100%);padding:8px 20px calc(28px + env(safe-area-inset-bottom))}
    aside.open{transform:none}
    .grab{display:block;width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:4px auto 14px}
    .btn{min-height:44px;padding:9px 14px}
    .btns .btn.primary{flex:1 1 100%;justify-content:center;font-size:15px}
    dl{grid-template-columns:84px 1fr}
    .close{width:40px;height:40px}
    .toast{bottom:calc(24px + env(safe-area-inset-bottom));max-width:calc(100% - 32px);text-align:center}
  }
</style>
</head>
<body>

<header>
  <div class="container nav">
    <a class="brand" href="#">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="3.2" fill="#58a6ff"/>
        <circle cx="4" cy="5" r="2" fill="#9aa4b4"/><circle cx="20" cy="5" r="2" fill="#9aa4b4"/>
        <circle cx="4" cy="19" r="2" fill="#9aa4b4"/><circle cx="20" cy="19" r="2" fill="#9aa4b4"/>
        <path d="M5.5 6.5 9.6 10.2M18.5 6.5l-4.1 3.7M5.5 17.5l4.1-3.7M18.5 17.5l-4.1-3.7" stroke="#58a6ff" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <span class="en">Juno Agent Hub</span><span class="ko">준오의 AI 허브</span>
    </a>
    <div class="nav-right">
      <span id="updated">상태 불러오는 중…</span>
      <a href="https://github.com/juno99zz-arkt" target="_blank" rel="noopener">GitHub</a>
    </div>
  </div>
</header>

<main class="container">
  <div class="head">
    <div>
      <div class="eyebrow">AGENTS</div>
      <h1>내 에이전트</h1>
    </div>
    <div class="summary" id="summary"></div>
  </div>

  <div class="toolbar">
    <label class="search">
      <input id="q" type="search" placeholder="Agent 검색" aria-label="Agent 검색">
      <kbd>/</kbd>
    </label>
    <div class="seg" id="statusFilter" role="group" aria-label="상태 필터">
      <button data-f="all" aria-pressed="true">전체</button>
      <button data-f="run" aria-pressed="false"><i class="dot run"></i>실행중</button>
      <button data-f="err" aria-pressed="false"><i class="dot err"></i>오류</button>
    </div>
    <div class="spacer"></div>
    <div class="seg" id="viewToggle" role="group" aria-label="보기 전환">
      <button data-v="compact" aria-pressed="true" title="컴팩트 보기">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="1" y="1" width="6" height="6" rx="1.5"/><rect x="9" y="1" width="6" height="6" rx="1.5"/><rect x="1" y="9" width="6" height="6" rx="1.5"/><rect x="9" y="9" width="6" height="6" rx="1.5"/></svg><span class="lbl">컴팩트</span></button>
      <button data-v="list" aria-pressed="false" title="리스트(표) 보기">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="1" y="2" width="14" height="2.4" rx="1"/><rect x="1" y="6.8" width="14" height="2.4" rx="1"/><rect x="1" y="11.6" width="14" height="2.4" rx="1"/></svg><span class="lbl">리스트</span></button>
    </div>
    <button class="icon-btn" id="refresh" title="상태 새로고침" aria-label="상태 새로고침">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
    </button>
  </div>

  <div id="view"></div>
  <div class="empty" id="empty">조건에 맞는 Agent가 없습니다.</div>

  <div class="note">
    <span class="st"><i class="dot run"></i>실행중: 자동 스케줄이 켜져 있음</span>
    <span class="st"><i class="dot"></i>대기: 필요할 때 여는 앱</span>
    <span class="st"><i class="dot paused"></i>일시정지: GitHub에서 스케줄 꺼짐</span>
    <span class="st"><i class="dot err"></i>오류: 마지막 실행 실패</span>
    <span class="hint">카드를 누르면 상세가 열립니다 · 숫자 키 <code>1</code>~<code>9</code>로 바로 열기 · Agent 추가는 <code>AGENTS</code> 목록에 한 줄</span>
  </div>
</main>

<div class="scrim" id="scrim"></div>
<aside id="panel" aria-label="Agent 상세" aria-hidden="true"></aside>
<div class="toast" id="toast" role="status"></div>

<script>
/* ── Agent 목록: 여기에 한 줄씩 추가하세요 ──
   type: "web"(배포된 사이트) | "local"(PC에서 실행 필요) | "skill"(Claude 스킬, 명령어 복사)
   repo: GitHub 저장소 이름(있으면 실행 기록을 불러옴) · workflow: 자동 실행 워크플로 파일 · sched: GitHub 밖 스케줄 설명
   허브는 GitHub 기록을 읽기만 하고, Agent 설정·스케줄은 바꾸지 않습니다. */
const OWNER = "juno99zz-arkt";
const AGENTS = [
  { name:"AI 투자 브리핑", kind:"Investing", cat:"투자", type:"web",
    desc:"미국 주식 장기투자 대시보드. 매일 시세, 격주 심층분석으로 최대 5종목을 추천합니다.",
    tags:["매일 아침 갱신", "월·금 메일 리포트"],
    url:"https://juno99zz-arkt.github.io/Invest/",
    repo:"Invest", workflow:"update_invest.yml" },
  { name:"HR AI 뉴스브리핑", kind:"AI Briefing", cat:"HR 업무", type:"web",
    desc:"HR AI T/F를 위한 주간 AI 브리핑. 월·수·금에 새 호가 발행됩니다.",
    tags:["월·수·금 발행", "Aside 자동 업데이트"],
    url:"https://juno99zz-arkt.github.io/HR-AI-Briefing/",
    repo:"HR-AI-Briefing", sched:"월·수·금 (Aside)" },
  { name:"피플팀 데일리 브리프", kind:"News Briefing", cat:"HR 업무", type:"web",
    desc:"삼성·노동·AI·디스플레이 등 8개 분야 뉴스를 매일 정리하는 HR 피플팀 브리핑.",
    tags:["평일 아침 자동", "메일 발송"],
    url:"https://juno99zz-arkt.github.io/Hr-Daily-Brief/",
    repo:"Hr-Daily-Brief", workflow:"daily_brief.yml" },
  { name:"홍콩·마카오 여행", kind:"Travel", cat:"생활", type:"web",
    desc:"12월 가족여행 일정·지도를 한 화면에서 보는 여행 앱.",
    tags:["12/12~12/20", "Claude 아티팩트"],

/* ── cron (UTC) → 다음 실행 시각 ── */
function cronField(f, min, max){
  const set = new Set();
  for (const part of f.split(",")){
    const [range, step] = part.split("/");
    let [a, b] = range === "*" ? [min, max] : range.split("-").map(Number);
    if (b === undefined) b = step ? max : a;
    for (let v = a; v <= b; v += Number(step || 1)) set.add(v === 7 && max === 7 ? 0 : v);
  }
  return set;
}
function nextRuns(crons, n){
  const specs = crons.map(c => {
    const [mi, h, dom, mon, dow] = c.trim().split(/\s+/);
    return { mi:cronField(mi,0,59), h:cronField(h,0,23), dom:cronField(dom,1,31), mon:cronField(mon,1,12), dow:cronField(dow,0,7),
             domAny: dom === "*", dowAny: dow === "*" };
  });
  const out = [], t = new Date(); t.setUTCSeconds(0, 0); t.setUTCMinutes(t.getUTCMinutes() + 1);
  for (let i = 0; i < 14 * 1440 && out.length < n; i++, t.setUTCMinutes(t.getUTCMinutes() + 1)){
    const hit = specs.some(s => {
      if (!s.mi.has(t.getUTCMinutes()) || !s.h.has(t.getUTCHours()) || !s.mon.has(t.getUTCMonth() + 1)) return false;
      const d1 = s.dom.has(t.getUTCDate()), d2 = s.dow.has(t.getUTCDay());
      return s.domAny || s.dowAny ? d1 && d2 : d1 || d2;
    });
    if (hit) out.push(new Date(t));
  }
  return out;
}

/* ── 시각 표시 (KST) ── */
const kst = (d, o) => new Intl.DateTimeFormat("ko-KR", { timeZone:"Asia/Seoul", ...o }).format(d);
const dayKey = d => kst(d, { year:"numeric", month:"2-digit", day:"2-digit" });
function fmtNext(d){
  const hm = kst(d, { hour:"2-digit", minute:"2-digit", hour12:false });
  const today = dayKey(new Date()), tmr = dayKey(new Date(Date.now() + 864e5));
  if (dayKey(d) === today) return `오늘 ${hm}`;
  if (dayKey(d) === tmr) return `내일 ${hm}`;
  return `${dayKey(d).replace(/^\d+\.\s*0?(\d+)\.\s*0?(\d+)\.?$/, "$1/$2")}(${kst(d, { weekday:"short" })}) ${hm}`;
}
function fmtAgo(d){
  const m = Math.round((Date.now() - d) / 60000);
  if (m < 1) return "방금";
  if (m < 60) return `${m}분 전`;
  if (m < 1440) return `${Math.round(m / 60)}시간 전`;
  return `${Math.round(m / 1440)}일 전`;
}
const fmtFull = d => `${dayKey(d).replace(/^\d+\.\s*0?(\d+)\.\s*0?(\d+)\.?$/, "$1/$2")}(${kst(d, { weekday:"short" })}) ${kst(d, { hour:"2-digit", minute:"2-digit", hour12:false })}`;

/* ── GitHub 공개 기록 읽기 (읽기 전용) ── */
async function gh(path){
  const r = await fetch(`https://api.github.com/repos/${OWNER}/${path}`, { headers:{ Accept:"application/vnd.github+json" } });
  if (!r.ok) throw new Error(r.status === 403 || r.status === 429 ? "조회 한도 초과" : `HTTP ${r.status}`);
  return r.json();
}
async function loadRepo(a, force){
  const key = "hub:gh:" + a.repo;
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(key)); } catch {}
  if (!force && cached && Date.now() - cached.t < TTL) return cached;
  try {
    const [runs, wf, yml] = await Promise.all([
      gh(`${a.repo}/actions/runs?per_page=15`),
      a.workflow ? gh(`${a.repo}/actions/workflows/${a.workflow}`) : null,
      a.workflow ? fetch(`https://raw.githubusercontent.com/${OWNER}/${a.repo}/HEAD/.github/workflows/${a.workflow}`).then(r => r.ok ? r.text() : "") : "",
    ]);
    const d = {
      t: Date.now(),
      runs: runs.workflow_runs.map(r => ({ id:r.workflow_id, name:r.name, event:r.event, status:r.status, conclusion:r.conclusion, at:r.run_started_at || r.created_at, url:r.html_url })),
      wfId: wf?.id, state: wf?.state, wfUrl: wf?.html_url,
      crons: [...yml.matchAll(/cron:\s*["']([^"']+)["']/g)].map(m => m[1]),
    };
    try { localStorage.setItem(key, JSON.stringify(d)); } catch {}
    return d;
  } catch (e) {
    if (cached) return { ...cached, stale: e.message };
    return { error: e.message };
  }
}

function info(a){
  if (!a.repo) return { s:"idle", runs:[], next:[] };
  const d = DATA[a.repo];
  if (!d) return { s:"unknown", runs:[], next:[] };
  if (d.error) return { s:"unknown", runs:[], next:[], error:d.error };
  const own = a.workflow ? d.runs.filter(r => r.id === d.wfId) : d.runs;
  const last = own[0] || d.runs[0];
  const next = d.crons?.length && d.state === "active" ? nextRuns(d.crons, 3) : [];
  let s = "idle", live = false;
  if (last && last.status !== "completed"){ s = "run"; live = true; }
  else if (last && FAIL.includes(last.conclusion)) s = "err";
  else if (a.workflow && d.state && d.state !== "active") s = "paused";
  else if (a.workflow || a.sched) s = "run";
  return { s, live, last, runs: d.runs.slice(0, 6), next, state:d.state, wfUrl:d.wfUrl, crons:d.crons, stale:d.stale };
}

const wfLink = a => `https://github.com/${OWNER}/${a.repo}/actions/workflows/${a.workflow}`;

function actions(a){
  const play = a.workflow
    ? `<a class="act" href="${wfLink(a)}" target="_blank" rel="noopener" title="수동 실행 (GitHub에서 Run workflow)" aria-label="${esc(a.name)} 수동 실행">${ICON.play}</a>`

    : `<button class="act" disabled title="자동 스케줄 없음" aria-label="일시정지 없음">${ICON.pause}</button>`;
  return play + pause;
}
const lastText = (a, i) => i.last ? fmtAgo(new Date(i.last.at)) : a.repo ? (i.s === "unknown" ? "…" : "—") : "—";
const nextText = (a, i) => i.next[0] ? fmtNext(i.next[0]) : a.sched || (i.s === "paused" ? "꺼짐" : "—");

function matches(a, i){
  const q = $("#q").value.trim().toLowerCase();
  if (filter !== "all" && i.s !== filter) return false;
  return !q || [a.name, a.kind, a.desc, a.cat, ...a.tags, STATUS[i.s]].join(" ").toLowerCase().includes(q);
}

    </dl><p class="muted" style="margin-top:10px">설정·스케줄 변경은 GitHub에서 합니다. 허브는 읽기만 합니다.</p></div>
    <div class="p-sec"><h3>다음 실행</h3>${sched}</div>
    <div class="p-sec"><h3>최근 실행 로그</h3>${log}${i.stale ? `<p class="muted" style="margin-top:8px">최신 기록을 못 받아 저장된 기록을 보여줍니다 (${esc(i.stale)}).</p>` : ""}</div>`;
}

function openPanel(k){
  if (mq.matches && selected === null){ try { history.pushState({ sheet:1 }, ""); } catch {} }   // 뒤로가기로 시트 닫기
  selected = k; render();
  $("#panel").classList.add("open"); $("#panel").setAttribute("aria-hidden", "false"); $("#scrim").classList.add("open");
  $("#closePanel").focus();
}
function closePanel(fromBack){
  if (selected === null) return;
  const k = selected; selected = null;
  if (fromBack !== true && history.state?.sheet) history.back();
  $("#panel").classList.remove("open"); $("#panel").setAttribute("aria-hidden", "true"); $("#scrim").classList.remove("open");
  render(); document.querySelector(`[data-k="${k}"]`)?.focus();
}

function openAgent(a){
  if (a.type === "skill") return copy(a.copy);
  window.open(a.url, "_blank", "noopener");
}
function copy(text){
  navigator.clipboard.writeText(text).then(() => toast(`복사됨: ${text} — Claude Code에 붙여넣으세요`), () => toast(text));
}
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200);
}

/* 서버가 15분마다 모아 둔 status.json (허브 저장소의 `status` 브랜치). 방문자가 많아도 GitHub 조회 한도를 쓰지 않는다. */
const CENTRAL_URL = `https://raw.githubusercontent.com/${OWNER}/agent-hub/status/status.json`;
const CENTRAL_MAX_AGE = 3 * 60 * 60 * 1000;   // 이보다 오래되면 자동 수집이 멈춘 것으로 보고 직접 조회로 되돌아간다
async function loadCentral(force){
  try {
    const r = await fetch(CENTRAL_URL, { cache: force ? "reload" : "default" });
    if (!r.ok) return null;
    const j = await r.json();
    return { t: Date.parse(j.generated), repos: j.repos || {} };
  } catch { return null; }
}

async function refresh(force){
  $("#refresh").classList.add("spin");
  const central = await loadCentral(force);
  const fresh = central && Date.now() - central.t < CENTRAL_MAX_AGE;
  await Promise.all(AGENTS.filter(a => a.repo).map(async a => {
    const c = central?.repos[a.repo];
    if (c && fresh) DATA[a.repo] = { ...c, t: central.t };
    else {
      const d = await loadRepo(a, force);
      DATA[a.repo] = c && d.error ? { ...c, t: central.t, stale: "자동 수집 기록이 오래됨" } : d;
    }
    render();
  }));
  $("#refresh").classList.remove("spin");
  const errs = Object.values(DATA).filter(d => d.error || d.stale).length;
  const ts = Object.values(DATA).map(d => d.t).filter(Boolean);
  const at = ts.length ? new Date(Math.min(...ts)) : new Date();
  $("#updated").textContent = `상태 ${kst(at, { hour:"2-digit", minute:"2-digit", hour12:false })} 기준` + (errs ? ` · ${errs}개 불러오기 실패` : "");
}

/* ── 이벤트 ── */
function setView(v){
  view = v;
  document.querySelectorAll("#viewToggle button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v));
  try { localStorage.setItem("hub:view", v); } catch {}
  render();
}
$("#viewToggle").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setView(b.dataset.v); });
$("#statusFilter").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll("#statusFilter button").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});
$("#q").addEventListener("input", render);
$("#refresh").addEventListener("click", () => refresh(true));
$("#scrim").addEventListener("click", closePanel);
$("#panel").addEventListener("click", e => {
  if (e.target.closest("#closePanel")) return closePanel();
  const o = e.target.closest("[data-open]"); if (o) openAgent(AGENTS[+o.dataset.open]);
});
// 휴대폰: 카드를 누르면 바로 열기, ⋯ 버튼은 상세 시트. PC: 카드를 누르면 상세 패널
function activate(k){
  const a = AGENTS[k];
  if (mq.matches && a.type !== "local") openAgent(a); else openPanel(k);
}
$("#view").addEventListener("click", e => {
  const o = e.target.closest("[data-open]"); if (o) return openAgent(AGENTS[+o.dataset.open]);
  const m = e.target.closest("[data-info]"); if (m) return openPanel(+m.dataset.info);
  if (e.target.closest("a,button")) return;
  const c = e.target.closest("[data-k]"); if (c) activate(+c.dataset.k);
});
$("#view").addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.target.closest("a,button")) return;
  const c = e.target.closest("[data-k]"); if (c) activate(+c.dataset.k);
});
window.addEventListener("popstate", () => closePanel(true));
mq.addEventListener("change", () => { closePanel(true); render(); });
document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (e.key === "Escape"){ if (typing) document.activeElement.blur(); else closePanel(); return; }
  if (e.key === "/" && !typing){ e.preventDefault(); $("#q").focus(); return; }
  if (!typing && !e.ctrlKey && !e.metaKey && !e.altKey && /^[1-9]$/.test(e.key)){
    const a = AGENTS[+e.key - 1]; if (a) openAgent(a);
  }
});

setView(view);
refresh(false);
setInterval(render, 60 * 1000);   // '몇 분 전'·다음 실행 표시 갱신
</script>
</body>
</html>
