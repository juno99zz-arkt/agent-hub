<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121312">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI 허브">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>AI 허브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 방향: 차분·정확·약간 따뜻함 / 세계: 새벽 운행표. 풍부한 곳은 '오늘 일정' 운행표 한 곳, 나머지는 조용하게.
     크기 12·13·14·16·24 / 굵기 400·500 / 반경 4·8·12 / 간격 4px 단위 / 강조색은 '지금'과 포커스에만 */
  :root{
    --bg:#f1f1f3; --surface:#ffffff; --raised:#e9e9ec;
    --line:rgba(23,23,23,.10); --line-2:rgba(23,23,23,.18);
    --text:#111113; --muted:#3f3f46; --dim:#62626b;
    --accent:#2f5fd3;
    --ok:#15803d; --warn:#b45309; --err:#dc2626; --idle:#a3a3a3;
    --shadow:0 8px 24px rgba(0,0,0,.06);
    --ease:cubic-bezier(.22,1,.36,1);
    --sans:"Noto Sans KR",-apple-system,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#141415; --surface:#19191b; --raised:#232325;
      --line:rgba(237,237,237,.08); --line-2:rgba(237,237,237,.16);
      --text:#ededed; --muted:#a1a1a6; --dim:#85858b;
      --accent:#8fb0f5;
      --ok:#4cc38a; --warn:#d9a23f; --err:#e5484d; --idle:#6b6b70;
      --shadow:none;
      color-scheme:dark;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:400 14px/20px var(--sans);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit}
  ::selection{background:color-mix(in srgb,var(--accent) 24%,transparent)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  html{scrollbar-color:var(--line-2) var(--bg)}
  .container{max-width:1440px;margin:0 auto;padding:0 32px}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* 머리글 */
  header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;justify-content:space-between;height:56px}
  .brand{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:500}
  .brand svg{color:var(--dim)}
  .nav-right{display:flex;align-items:center;gap:16px;font-size:13px;color:var(--muted)}
  .nav-right a:hover{color:var(--text)}
  .guide-btn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:8px;background:var(--text);color:var(--bg);font-size:13px;font-weight:500;transition:opacity .15s var(--ease)}
  .nav-right a.guide-btn:hover{color:var(--bg);opacity:.88}
  .head-r{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  .upd{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}

  /* 제목 · 분류 탭 */
  .head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:32px 0 12px}
  h1{font-size:24px;line-height:32px;font-weight:500}
  .summary{display:flex;gap:16px;font-size:13px;color:var(--muted)}
  .summary b{color:var(--text);font-weight:500;font-family:var(--mono)}
  .tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{position:relative;border:0;background:none;padding:12px 0;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px;transition:color .15s var(--ease)}
  .tabs button:hover{color:var(--text)}
  .tabs button small{font:400 12px var(--mono);color:var(--dim)}
  .tabs button[aria-selected="true"]{color:var(--text);font-weight:500}
  .tabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--text)}
  .tabs .dot{width:6px;height:6px}

  /* 상태 점 */
  .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--idle)}
  .dot.run{background:var(--ok)} .dot.err{background:var(--err)} .dot.paused,.dot.warn{background:var(--warn)}
  .dot.unknown{background:transparent;border:1.5px solid var(--dim)}
  .dot.manual{background:transparent;border:1.5px dashed var(--dim)}
  .dot.todo{background:transparent;border:1.5px solid var(--muted)}
  .dot.live{animation:live 1.6s var(--ease) infinite}      /* 실제로 실행 중일 때만 */
  @keyframes live{50%{opacity:.35}}

  /* 앱 아이콘: 선 아이콘 한 벌(1.5 굵기) + 이상이 있을 때만 모서리 상태 점 */
  .ic{--ring:var(--bg);position:relative;flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--cb,var(--raised));color:var(--c,var(--muted))}
  .ic svg{width:18px;height:18px}
  .ic .dot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;box-shadow:0 0 0 2px var(--ring)}
  .card:hover .ic,.card.sel .ic{--ring:var(--raised)}
  /* 분류 색: 분류마다 한 색. 아이콘 칸과 묶음 제목 표식에만 쓴다 */
  .c-life{--c:#0f7a4f;--cb:#d9f1e4} .c-work{--c:#2457c5;--cb:#dfe8fc} .c-invest{--c:#b45309;--cb:#fbe8cf}
  .c-grow{--c:#be185d;--cb:#fbe1ec} .c-sys{--c:#475569;--cb:#e1e5ec}
  @media (prefers-color-scheme:dark){
    .c-life{--c:#5fd3a0;--cb:rgba(95,211,160,.15)} .c-work{--c:#8fb0f5;--cb:rgba(143,176,245,.15)} .c-invest{--c:#f0b45a;--cb:rgba(240,180,90,.15)}
    .c-grow{--c:#f38bb5;--cb:rgba(243,139,181,.15)} .c-sys{--c:#a7b1c2;--cb:rgba(167,177,194,.14)}
  }
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* 관제: 조치 필요 + 오늘 일정(운행표) */
  .ops-d{margin:16px 0 8px}
  .ops-d>summary{list-style:none;cursor:pointer;font-size:13px;color:var(--muted);padding:4px 0 12px;display:flex;align-items:center;gap:8px}
  .ops-d>summary::-webkit-details-marker{display:none}
  .ops-d>summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s var(--ease)}
  .ops-d[open]>summary::before{transform:rotate(45deg)}
  .ops-d>summary b{color:var(--text);font-weight:500;font-family:var(--mono)}
  .ops-d>summary .bad{color:var(--err)}
  .ops{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  .box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 20px;min-width:0;box-shadow:var(--shadow)}
  .box h2{font-size:14px;font-weight:500;display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
  .box h2 b{font:500 13px var(--mono);color:var(--muted)}
  .box h2 b.bad{color:var(--err)}
  .box h2 b:empty{display:none}
  .box h2 span{color:var(--muted);font-weight:400;font-size:13px}
  .box h2 .sub{margin-left:auto;color:var(--dim);font-size:12px}
  .olist{list-style:none;font-size:13px}
  .olist li{border-top:1px solid var(--line)}
  .olist li:first-child{border-top:0}
  .olist li>a,.olist li>div{display:flex;align-items:flex-start;gap:12px;padding:8px 0}
  .olist .dot{margin-top:6px}
  .olist .w{flex:1;min-width:0}
  .olist a:hover .w{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
  .olist small{display:block;color:var(--dim);font-size:12px;line-height:16px;margin-top:2px}
  .olist li.ok .w{color:var(--muted)}
  .pill{font-size:12px;color:var(--muted);border:1px solid var(--line-2);border-radius:4px;padding:0 4px;margin-right:8px}
  .more{margin-top:4px;border:0;background:none;padding:8px 0 0;font-size:13px;color:var(--muted);cursor:pointer}
  .more:hover{color:var(--text)}
  /* 운행표: 예정 시각 · 작업 · 실제 시각 · 지연 */
  .tt{list-style:none;font-size:13px}
  .tt li>a,.tt li>div{display:grid;grid-template-columns:48px minmax(0,1fr) 48px 88px;align-items:center;gap:12px;height:36px;border-top:1px solid var(--line)}
  .tt li.hd>div{height:24px;border-top:0;font-size:12px;color:var(--dim)}
  .tt li.hd+li>a,.tt li.hd+li>div{border-top-color:var(--line-2)}
  .tt time,.tt .at,.tt .dly{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .tt .at,.tt .dly,.tt li.hd span:nth-child(n+3){text-align:right}
  .tt .w{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tt time{color:var(--text)}
  .tt .at{color:var(--muted)}
  .tt .dly{color:var(--dim);white-space:nowrap}
  .tt li.done time{color:var(--dim)}
  .tt li.done .w{color:var(--muted)}
  .tt li.fail .dly,.tt li.missed .dly{color:var(--err)}
  .tt li.run .dly{color:var(--ok)}
  .tt li.next .w{font-weight:500}
  .tt li.next .dly{color:var(--text)}
  .tt a:hover .w{color:var(--text);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-2)}
  .tt li.now>div{display:flex;height:20px;border-top:0;gap:8px;font:400 12px var(--mono);color:var(--accent)}
  .tt li.now>div::after{content:"";flex:1;height:1px;background:var(--accent);opacity:.6}
  .tt li.now+li>a,.tt li.now+li>div{border-top:0}
  .tt li.none>div{display:block;height:auto;padding:8px 0;color:var(--dim);border-top:0}

  /* 도구 줄 */
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 4px}
  .search{position:relative;flex:1 1 260px;max-width:360px}
  .search input{width:100%;height:36px;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:0 40px 0 12px;color:var(--text);font:400 14px var(--sans);outline:none;transition:border-color .15s var(--ease)}
  .search input::placeholder{color:var(--dim)}
  .search input:focus{border-color:var(--accent)}
  .search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:400 12px var(--mono);color:var(--dim);border:1px solid var(--line-2);border-radius:4px;padding:0 6px;line-height:18px}
  .seg{display:flex;height:36px;border:1px solid var(--line-2);border-radius:8px;padding:2px;gap:2px}
  .seg button{border:0;background:none;border-radius:6px;padding:0 12px;font-size:13px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:8px;transition:color .15s var(--ease),background-color .15s var(--ease)}
  .seg button:hover{color:var(--text)}
  .seg button[aria-pressed="true"]{background:var(--raised);color:var(--text)}
  .spacer{flex:1}
  .icon-btn{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line-2);border-radius:8px;background:none;cursor:pointer;color:var(--muted);transition:color .15s var(--ease)}
  .icon-btn:hover{color:var(--text)}
  .icon-btn.spin svg{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* 분류 묶음 · 줄 목록 */
  .grp{margin-top:32px}
  .grp:first-child{margin-top:16px}
  .grp>h2{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--text);padding-bottom:8px;border-bottom:1px solid var(--line-2)}
  .grp>h2::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c,var(--dim))}
  .grp>h2 small{font:400 12px var(--mono);color:var(--dim)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));column-gap:32px}
  .card{display:flex;align-items:center;gap:12px;height:56px;border-bottom:1px solid var(--line);padding:0 4px;cursor:pointer;transition:background-color .15s var(--ease)}
  .card:hover,.card.sel{background:var(--raised)}
  .card .body{flex:1;min-width:0}
  .card .name{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500}
  .card .name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .times{font-size:12px;line-height:16px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .times b{color:var(--muted);font-weight:400}
  .acts{display:flex;gap:4px;flex:none}
  .card .acts{opacity:0;transition:opacity .15s var(--ease)}
  .card:hover .acts,.card:focus-within .acts,.card.sel .acts{opacity:1}
  .act{width:28px;height:28px;display:grid;place-items:center;border-radius:8px;border:0;background:none;cursor:pointer;color:var(--muted);transition:color .15s var(--ease),background-color .15s var(--ease)}
  .act:hover{color:var(--text);background:var(--surface)}
  .act[disabled]{opacity:.3;cursor:default;pointer-events:none}

  /* 표 보기 */
  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px}
  th{text-align:left;font-size:12px;font-weight:400;color:var(--dim);padding:8px 12px;border-bottom:1px solid var(--line)}
  td{height:40px;padding:0 12px;border-bottom:1px solid var(--line);color:var(--muted);white-space:nowrap}
  tbody tr{cursor:pointer}
  tbody tr:hover td,tbody tr.sel td{background:var(--raised)}
  td.nm{color:var(--text);font-weight:500;font-size:14px}
  tr.grp-row th{color:var(--muted);font-size:13px;font-weight:500;padding:24px 12px 8px;border-bottom:1px solid var(--line-2)}
  tbody:first-of-type tr.grp-row th{padding-top:12px}
  .st{display:inline-flex;align-items:center;gap:8px}

  .empty{display:none;color:var(--dim);padding:40px 0;text-align:center}
  .note{margin:32px 0;font-size:12px;color:var(--dim);display:flex;gap:8px 20px;flex-wrap:wrap}
  .note .st{gap:8px}

  /* 상세 패널 */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);opacity:0;pointer-events:none;transition:opacity .2s var(--ease);z-index:20}
  .scrim.open{opacity:1;pointer-events:auto}
  aside{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:100%;background:var(--surface);border-left:1px solid var(--line-2);z-index:21;
        transform:translateX(100%);transition:transform .3s var(--ease);overflow-y:auto;padding:24px 24px 32px}
  aside.open{transform:none}
  .p-top{display:flex;justify-content:space-between;align-items:center}
  .k{font-size:12px;color:var(--dim)}
  aside h2{font-size:24px;line-height:32px;font-weight:500;margin:8px 0}
  .badge{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  aside p.desc{color:var(--muted);margin:16px 0}
  .tags{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--dim)}
  .tag+.tag::before{content:"·";margin-right:12px}
  .p-sec{margin-top:24px}
  .p-sec h3{font-size:13px;font-weight:500;color:var(--muted);margin-bottom:8px}
  .btns{display:flex;flex-wrap:wrap;gap:8px}
  .btn{display:inline-flex;align-items:center;gap:8px;height:36px;border:1px solid var(--line-2);border-radius:8px;padding:0 12px;font-size:13px;background:none;cursor:pointer;transition:background-color .15s var(--ease)}
  .btn:hover{background:var(--raised)}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--text);border-color:var(--text);color:var(--bg);font-weight:500}
  .btn.primary:hover{background:var(--text);opacity:.88}
  dl{display:grid;grid-template-columns:96px 1fr;gap:8px 12px;font-size:13px}
  dt{color:var(--dim)} dd{color:var(--text)}
  dd code,code{font:400 12px var(--mono);color:var(--muted)}
  .log{list-style:none;font-size:13px}
  .log li{display:flex;align-items:center;gap:12px;height:36px;border-top:1px solid var(--line)}
  .log li:first-child{border-top:0}
  .log .w{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
  .log time{font:400 12px var(--mono);color:var(--dim)}
  .log a:hover .w{color:var(--text)}
  .muted{font-size:13px;color:var(--dim)}
  .close{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line-2);background:none;cursor:pointer;color:var(--muted)}
  .close:hover{color:var(--text)}

  .toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,8px);opacity:0;background:var(--text);color:var(--bg);border-radius:8px;padding:8px 16px;font-size:13px;transition:opacity .2s var(--ease),transform .2s var(--ease);pointer-events:none;z-index:30}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (prefers-reduced-motion:reduce){aside,.scrim,.toast{transition:none}.dot.live,.icon-btn.spin svg{animation:none}}
  .brand .ko,.grab{display:none}
  @media (max-width:900px){.ops{grid-template-columns:1fr}}

  /* ── 휴대폰: 앱처럼 (탭=열기, ⋯=상세 시트) ── */
  @media (max-width:760px){
    body{padding-bottom:calc(24px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
    header{padding-top:env(safe-area-inset-top)}
    .container{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
    .brand .en{display:none}
    .brand .ko{display:inline}
    .nav-right a.gh{display:none}
    .guide-btn{height:36px}
    .head-r{gap:4px 16px}
    .head{padding:16px 0 4px}
    .head h1{display:none}
    .tabs{gap:24px;margin:0 -16px;padding:0 16px}
    .tabs button{font-size:16px;padding:12px 0}
    .box{padding:16px}
    .tt li>a,.tt li>div{grid-template-columns:44px minmax(0,1fr) 44px 72px;gap:8px;height:40px}
    /* 1줄: 검색 + 새로고침 / 2줄: 상태 필터 + 보기 전환 */
    .toolbar{gap:8px;margin:12px 0 4px}
    .search{max-width:none;flex:1 1 calc(100% - 52px);order:0}
    .search input{height:44px;font-size:16px}
    .search kbd,.spacer,.lbl{display:none}
    #refresh{order:1}
    .seg{height:44px}
    #statusFilter{flex:1 1 0;min-width:0;order:2}
    #statusFilter button{flex:1 1 0;min-width:0;justify-content:center;gap:6px;padding:0 4px;white-space:nowrap}
    #viewToggle{order:3}
    #viewToggle button{padding:0 12px}
    .icon-btn{width:44px;height:44px}
    .grp{margin-top:24px}

    .name{display:flex;align-items:center;gap:8px;font-weight:500}
    .info{width:44px;height:44px;border:0;background:none;border-radius:8px;display:grid;place-items:center;color:var(--dim);cursor:pointer;flex:none}
    .info:active{color:var(--text)}
    .ic{width:40px;height:40px;border-radius:10px}
    .ic svg{width:20px;height:20px}

    .rows{display:flex;flex-direction:column}
    .row{display:flex;align-items:center;gap:12px;height:64px;border-bottom:1px solid var(--line);cursor:pointer;touch-action:manipulation;transition:background-color .15s var(--ease)}
    .row .body{flex:1;min-width:0}
    .row .name{font-size:16px}
    .row .name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .row .times{font-size:12px;line-height:16px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ═══ 테마: '워크플로 캔버스' (참고: ssaengcho-tip 링크 페이지, 2026-11-22) ═══

</style>

<script>
/* ── Agent 목록은 registry.json 의 agents 에 한 줄씩 추가하세요 ──
   type: "web"(배포된 사이트) | "local"(PC에서 실행 필요) | "skill"(Claude 스킬, 명령어 복사) | "auto"(GitHub 밖 자동 루틴)
   repo: GitHub 저장소 이름(있으면 실행 기록을 불러옴) · workflow: 자동 실행 워크플로 파일 · watch: 함께 볼 보조 워크플로
   sched: 스케줄 설명 · manual: 자동 확인 불가(수동 확인) · heartbeat: GH 디스패처 호출 상태로 판정 · link: 상세 링크
   schedule(디스패처 작업표)·todos(직접 할 일)도 registry.json 에 있습니다.
   허브는 GitHub 기록을 읽기만 하고, Agent 설정·스케줄은 바꾸지 않습니다. */
const OWNER = "juno99zz-arkt";
let AGENTS = [], REG = { schedule:[], todos:[] }, CENTRAL = null;   // registry.json 에서 채움


const TYPE_LABEL = { web:"배포됨", local:"로컬 실행", skill:"Claude 스킬", auto:"자동 루틴" };
const STATUS = { run:"실행중", idle:"대기 / 최근 실행 완료", paused:"일시정지", err:"오류", unknown:"확인 중", manual:"수동 확인", warn:"주의" };
const FAIL = ["failure","timed_out","startup_failure"];
const TTL = 15 * 60 * 1000;   // GitHub 비로그인 조회 한도(시간당 60회) 때문에 15분 캐시
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DATA = {};              // repo → { runs, state, wfId, crons, t } | { error }
const mq = matchMedia("(max-width:760px)");   // 휴대폰 화면
let cat = "all", filter = "all", view = mq.matches ? "list" : "compact", selected = null;

try { view = localStorage.getItem("hub:view") || view; cat = localStorage.getItem("hub:cat") || cat; } catch {}

/* ── cron (UTC) → 다음 실행 시각 ── */
function cronField(f, min, max){
  const set = new Set();
  for (const part of f.split(",")){
    const [range, step] = part.split("/");
    let [a, b] = range === "*" ? [min, max] : range.split("-").map(Number);
    if (b === undefined) b = step ? max : a;
    for (let v = a; v <= b; v += Number(step || 1)) set.add(v === 7 && max === 7 ? 0 : v);
  }
  return set;
}
function nextRuns(crons, n){
  const specs = crons.map(c => {
    const [mi, h, dom, mon, dow] = c.trim().split(/\s+/);
    return { mi:cronField(mi,0,59), h:cronField(h,0,23), dom:cronField(dom,1,31), mon:cronField(mon,1,12), dow:cronField(dow,0,7),
             domAny: dom === "*", dowAny: dow === "*" };
  });
  const out = [], t = new Date(); t.setUTCSeconds(0, 0); t.setUTCMinutes(t.getUTCMinutes() + 1);
  for (let i = 0; i < 14 * 1440 && out.length < n; i++, t.setUTCMinutes(t.getUTCMinutes() + 1)){
    const hit = specs.some(s => {
      if (!s.mi.has(t.getUTCMinutes()) || !s.h.has(t.getUTCHours()) || !s.mon.has(t.getUTCMonth() + 1)) return false;
      const d1 = s.dom.has(t.getUTCDate()), d2 = s.dow.has(t.getUTCDay());
      return s.domAny || s.dowAny ? d1 && d2 : d1 || d2;
    });
    if (hit) out.push(new Date(t));
  }
  return out;
}

/* ── 시각 표시 (KST) ── */
const kst = (d, o) => new Intl.DateTimeFormat("ko-KR", { timeZone:"Asia/Seoul", ...o }).format(d);
const dayKey = d => kst(d, { year:"numeric", month:"2-digit", day:"2-digit" });
function fmtNext(d){
  const hm = kst(d, { hour:"2-digit", minute:"2-digit", hour12:false });
  const today = dayKey(new Date()), tmr = dayKey(new Date(Date.now() + 864e5));
  if (dayKey(d) === today) return `오늘 ${hm}`;
  if (dayKey(d) === tmr) return `내일 ${hm}`;
  return `${dayKey(d).replace(/^\d+\.\s*0?(\d+)\.\s*0?(\d+)\.?$/, "$1/$2")}(${kst(d, { weekday:"short" })}) ${hm}`;
}
function fmtAgo(d){
  const m = Math.round((Date.now() - d) / 60000);
  if (m < 1) return "방금";
  if (m < 60) return `${m}분 전`;
  if (m < 1440) return `${Math.round(m / 60)}시간 전`;
  return `${Math.round(m / 1440)}일 전`;
}
const fmtFull = d => `${dayKey(d).replace(/^\d+\.\s*0?(\d+)\.\s*0?(\d+)\.?$/, "$1/$2")}(${kst(d, { weekday:"short" })}) ${kst(d, { hour:"2-digit", minute:"2-digit", hour12:false })}`;

/* ── GitHub 공개 기록 읽기 (읽기 전용) ── */
async function gh(path){
  const r = await fetch(`https://api.github.com/repos/${OWNER}/${path}`, { headers:{ Accept:"application/vnd.github+json" } });
  if (!r.ok) throw new Error(r.status === 403 || r.status === 429 ? "조회 한도 초과" : `HTTP ${r.status}`);
  return r.json();
}
async function loadRepo(a, force){
  const key = "hub:gh:" + a.repo;
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(key)); } catch {}
  if (!force && cached && Date.now() - cached.t < TTL) return cached;
  try {
    const [runs, wf, yml] = await Promise.all([
      gh(`${a.repo}/actions/runs?per_page=15`),
      a.workflow ? gh(`${a.repo}/actions/workflows/${a.workflow}`) : null,
      a.workflow ? fetch(`https://raw.githubusercontent.com/${OWNER}/${a.repo}/HEAD/.github/workflows/${a.workflow}`).then(r => r.ok ? r.text() : "") : "",
    ]);
    const d = {
      t: Date.now(),
      runs: runs.workflow_runs.map(r => ({ id:r.workflow_id, name:r.name, event:r.event, status:r.status, conclusion:r.conclusion, at:r.run_started_at || r.created_at, url:r.html_url })),
      wfId: wf?.id, state: wf?.state, wfUrl: wf?.html_url,
      crons: [...yml.matchAll(/cron:\s*["']([^"']+)["']/g)].map(m => m[1]),
    };
    try { localStorage.setItem(key, JSON.stringify(d)); } catch {}
    return d;
  } catch (e) {
    if (cached) return { ...cached, stale: e.message };
    return { error: e.message };
  }
}

function info(a){
  if (a.heartbeat){
    const hb = CENTRAL?.heartbeat;
    if (!hb) return { s:"unknown", runs:[], next:[] };
    return { s: hb.ok ? "idle" : "err", runs:[], next:[], last:{ at:hb.last } };
  }
  if (a.vault && CENTRAL?.vault?.[a.name]){
    const v = CENTRAL.vault[a.name];
    return { s: v.level === "error" ? "err" : v.level === "warn" ? "warn" : "idle", runs:[], next:[], last: v.at ? { at:v.at } : null, checks:[{ message:v.message }] };
  }
  if (a.manual) return { s:"manual", runs:[], next:[] };
  if (!a.repo) return { s:"idle", runs:[], next:[] };
  const d = DATA[a.repo];
  if (!d) return { s:"unknown", runs:[], next:[] };
  if (d.error) return { s:"unknown", runs:[], next:[], error:d.error };
  const own = a.workflow ? d.runs.filter(r => r.id === d.wfId) : d.runs;
  const last = own[0];
  const next = d.crons?.length && d.state === "active" ? nextRuns(d.crons, 3) : [];
  let s = "idle", live = false;
  if (last && last.status !== "completed"){ s = "run"; live = true; }
  else if (last && FAIL.includes(last.conclusion)) s = "err";
  else if (a.workflow && d.state && d.state !== "active") s = "paused";
  else if (a.workflow && last?.conclusion === "success") s = "idle";
  if (d.checks?.some(c => c.level === "error")) s = "err";
  else if (d.stale || (a.workflow && !last) || d.checks?.some(c => c.level === "unknown")) s = "unknown";
  return { s, live, last, runs: d.runs.slice(0, 6), next, state:d.state, wfUrl:d.wfUrl, crons:d.crons, stale:d.stale, checks:d.checks || [] };
}

const ICON = {
  play:'<svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4 2.5v11l9-5.5z"/></svg>',

  close:'<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 3l10 10M13 3 3 13"/></svg>',
};
const wfLink = a => `https://github.com/${OWNER}/${a.repo}/actions/workflows/${a.workflow}`;

function actions(a){
  const play = a.workflow
    ? `<a class="act" href="${wfLink(a)}" target="_blank" rel="noopener" title="수동 실행 (GitHub에서 Run workflow)" aria-label="${esc(a.name)} 수동 실행">${ICON.play}</a>`
    : `<button class="act" data-open="${AGENTS.indexOf(a)}" title="${a.type === "skill" ? "명령어 복사" : "열기"}" aria-label="${esc(a.name)} 열기">${ICON.play}</button>`;
  const pause = a.workflow
    ? `<a class="act" href="${wfLink(a)}" target="_blank" rel="noopener" title="일시정지·재개 (GitHub 워크플로 화면에서 Disable/Enable)" aria-label="${esc(a.name)} 일시정지 설정">${ICON.pause}</a>`
    : `<button class="act" disabled title="자동 스케줄 없음" aria-label="일시정지 없음">${ICON.pause}</button>`;
  return play + pause;
}
const lastText = (a, i) => i.last ? fmtAgo(new Date(i.last.at)) : a.repo ? (i.s === "unknown" ? "…" : "—") : "—";
// 예약은 GH 디스패처(Apps Script)가 호출하므로 sched 설명을 우선 표시 (2026-11-08)
const nextText = (a, i) => a.sched || (i.next[0] ? fmtNext(i.next[0]) : (i.s === "paused" ? "꺼짐" : "—"));

function matches(a, i){
  const q = $("#q").value.trim().toLowerCase();
  if (cat !== "all" && a.cat !== cat) return false;
  if (filter !== "all" && i.s !== filter) return false;
  return !q || [a.name, a.kind, a.desc, a.cat, ...a.tags, STATUS[i.s]].join(" ").toLowerCase().includes(q);
}

const IC_BY = {

};
const BADGE = ["run", "err", "warn", "paused"];   // 대기·수동 확인은 점을 달지 않는다 (이상 있을 때만 눈에 띄게)
const icHtml = (a, i) => `<span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${IC[a.icon] || IC[IC_BY[a.name] || IC_BY[a.kind]] || IC.app}</svg>${BADGE.includes(i.s) ? `<i class="dot ${i.s}${i.live ? " live" : ""}"></i>` : ""}</span>`;
const srHtml = i => `<span class="sr">, ${STATUS[i.s]}</span>`;
const catList = () => [...CATS, ...new Set(AGENTS.map(a => a.cat).filter(c => !CATS.includes(c)))];

/* 한 분류에 속한 Agent 목록 (휴대폰: 타일·줄 / PC: 줄 목록) */
function itemsHtml(rows){
  if (mq.matches){
    const more = k => `<button class="info" data-info="${k}" aria-label="${esc(AGENTS[k].name)} 상세 보기">${DOTS}</button>`;
    return view === "compact"
      ? `<div class="tiles">${rows.map(({a, k, i}) => `
          <article class="tile" tabindex="0" data-k="${k}">${more(k)}${icHtml(a, i)}
            <div class="name"><span>${esc(a.name)}</span>${srHtml(i)}</div></article>`).join("")}</div>`
      : `<div class="rows">${rows.map(({a, k, i}) => `
          <article class="row" tabindex="0" data-k="${k}">${icHtml(a, i)}
            <div class="body"><div class="name"><span>${esc(a.name)}</span>${srHtml(i)}</div>
              <div class="times">최근 <b>${lastText(a, i)}</b> · 다음 <b>${esc(nextText(a, i))}</b></div></div>${more(k)}</article>`).join("")}</div>`;
  }
  return `<div class="grid">${rows.map(({a, k, i}) => `
      <article class="card${selected === k ? " sel" : ""}" tabindex="0" data-k="${k}">${icHtml(a, i)}
        <div class="body">
          <div class="name"><span>${esc(a.name)}</span>${srHtml(i)}</div>
          <div class="times">최근 <b>${lastText(a, i)}</b> · 다음 <b>${esc(nextText(a, i))}</b></div>

}

function render(){
  const all = AGENTS.map((a, k) => ({ a, k, i: info(a) }));
  const rows = all.filter(r => matches(r.a, r.i));
  const groups = (cat === "all" ? catList() : [cat]).map(c => ({ c, rows: rows.filter(r => r.a.cat === c) })).filter(g => g.rows.length);
  const head = g => cat === "all" ? `<h2>${esc(g.c)} <small>${g.rows.length}</small></h2>` : "";
  const html = !mq.matches && view === "list"
    ? `<div class="table-wrap"><table>
        <thead><tr><th>이름</th><th>상태</th><th>마지막 실행</th><th>다음 실행</th><th>동작</th></tr></thead>
        ${groups.map(g => `<tbody>${cat === "all" ? `<tr class="grp-row"><th colspan="5" scope="colgroup">${esc(g.c)}</th></tr>` : ""}${g.rows.map(({a, k, i}) => `
          <tr class="${selected === k ? "sel" : ""}" data-k="${k}" tabindex="0">
            <td class="nm">${esc(a.name)}</td>
            <td><span class="st">${dotHtml(i)}${STATUS[i.s]}</span></td>
            <td>${i.last ? `${fmtFull(new Date(i.last.at))} <span class="muted">(${fmtAgo(new Date(i.last.at))})</span>` : "—"}</td>
            <td>${esc(nextText(a, i))}</td>
            <td><div class="acts">${actions(a)}</div></td>
          </tr>`).join("")}</tbody>`).join("")}</table></div>`
    : groups.map(g => `<section class="grp ${CAT_CLS[g.c] || "c-sys"}">${head(g)}${itemsHtml(g.rows)}</section>`).join("");
  renderOps();
  $("#view").innerHTML = rows.length ? html : "";
  $("#empty").style.display = rows.length ? "none" : "block";

  // 분류 탭: 개수와, 그 분류에 오류·주의가 있으면 점 하나
  const flag = list => list.some(r => r.i.s === "err") ? "err" : list.some(r => r.i.s === "warn") ? "warn" : "";
  const tab = (id, label, list) => `<button role="tab" data-cat="${esc(id)}" aria-selected="${cat === id}">${esc(label)} <small>${list.length}</small>${flag(list) ? `<i class="dot ${flag(list)}" title="확인 필요"></i>` : ""}</button>`;
  $("#cats").innerHTML = tab("all", "전체", all) + catList().map(c => tab(c, c, all.filter(r => r.a.cat === c))).join("");

  const c = s => all.filter(r => r.i.s === s).length;
  $("#summary").innerHTML = `<span>실행중 <b>${c("run")}</b></span>`
    + (c("paused") ? `<span>일시정지 <b>${c("paused")}</b></span>` : "") + (c("warn") ? `<span>주의 <b>${c("warn")}</b></span>` : "") + `<span>오류 <b${c("err") ? ' style="color:var(--err)"' : ""}>${c("err")}</b></span>`;
  if (selected !== null) renderPanel();
}

  if (a.type === "auto" && !a.repo) log = a.heartbeat
    ? `<p class="muted">${i.last ? `마지막 호출 ${fmtFull(new Date(i.last.at))} (${fmtAgo(new Date(i.last.at))}) — 허브 상태 갱신(15분)을 디스패처가 호출한 시각으로 판정합니다.` : "호출 기록을 불러오는 중…"}</p>`
    : CENTRAL?.vault?.[a.name]
    ? `<p class="muted">볼트(비공개 저장소)에 마지막으로 올라온 기록 시각으로 판정합니다. PC의 Obsidian이 꺼져 있으면 기록이 늦게 올라와 '주의'로 보일 수 있습니다.</p>`
    : `<p class="muted">GitHub 밖에서 도는 루틴이라 허브가 자동으로 확인하지 못합니다. 볼트의 AI 작업기록·정리 리포트로 확인하세요.</p>`;

  $("#panel").innerHTML = `
    <div class="grab"></div>

    <p class="desc">${esc(a.desc)}</p>
    <div class="tags">${[TYPE_LABEL[a.type], ...a.tags].map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>
    <div class="p-sec"><div class="btns">${openBtn}${links}</div></div>
    <div class="p-sec"><h3>설정</h3><dl>
      <dt>유형</dt><dd>${TYPE_LABEL[a.type]}</dd>
      ${a.url ? `<dt>주소</dt><dd style="word-break:break-all">${esc(a.url)}</dd>` : ""}
      ${a.repo ? `<dt>저장소</dt><dd>${OWNER}/${esc(a.repo)}</dd>` : ""}
      ${a.workflow ? `<dt>워크플로</dt><dd>${esc(a.workflow)} ${i.state ? `<span class="muted">(${i.state === "active" ? "켜짐" : "꺼짐"})</span>` : ""}</dd>` : ""}
      ${i.crons?.length ? `<dt>cron (UTC)</dt><dd>${i.crons.map(c => `<code>${esc(c)}</code>`).join(" ")}</dd>` : ""}
    </dl><p class="muted" style="margin-top:10px">설정·스케줄 변경은 GitHub에서 합니다. 허브는 읽기만 합니다.</p></div>
    <div class="p-sec"><h3>다음 실행</h3>${sched}</div>
    <div class="p-sec"><h3>결과 확인</h3><p class="muted">${i.checks?.length ? i.checks.map(c => esc(c.message)).join("<br>") : "실행 기록 기준입니다. 결과 저장·메일 수신·휴대폰 전달은 별도 확인이 필요합니다."}</p></div>
    <div class="p-sec"><h3>최근 실행 로그</h3>${log}${i.stale ? `<p class="muted" style="margin-top:8px">최신 기록을 못 받아 저장된 기록을 보여줍니다 (${esc(i.stale)}).</p>` : ""}</div>`;
}

function openPanel(k){
  if (mq.matches && selected === null){ try { history.pushState({ sheet:1 }, ""); } catch {} }   // 뒤로가기로 시트 닫기
  selected = k; render();
  $("#panel").classList.add("open"); $("#panel").setAttribute("aria-hidden", "false"); $("#scrim").classList.add("open");
  $("#closePanel").focus();
}
function closePanel(fromBack){
  if (selected === null) return;
  const k = selected; selected = null;
  if (fromBack !== true && history.state?.sheet) history.back();
  $("#panel").classList.remove("open"); $("#panel").setAttribute("aria-hidden", "true"); $("#scrim").classList.remove("open");
  render(); document.querySelector(`[data-k="${k}"]`)?.focus();
}

function openAgent(a){
  if (a.type === "skill") return copy(a.copy);
  if (!a.url) return openPanel(AGENTS.indexOf(a));   // 자동 루틴처럼 열 사이트가 없으면 상세를 보여 준다
  window.open(a.url, "_blank", "noopener");
}
function copy(text){
  navigator.clipboard.writeText(text).then(() => toast(`복사됨: ${text} — Claude Code에 붙여넣으세요`), () => toast(text));
}
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200);
}

/* 서버가 15분마다 모아 둔 status.json (허브 저장소의 `status` 브랜치). 방문자가 많아도 GitHub 조회 한도를 쓰지 않는다. */
const CENTRAL_URL = `https://raw.githubusercontent.com/${OWNER}/agent-hub/refs/heads/status/status.json`;
const CENTRAL_MAX_AGE = 45 * 60 * 1000;   // 이보다 오래되면 자동 수집이 멈춘 것으로 보고 직접 조회로 되돌아간다
async function loadCentral(force){
  try {
    const r = await fetch(CENTRAL_URL, { cache: force ? "reload" : "default" });
    if (!r.ok) return null;
    const j = await r.json();
    return { t: Date.parse(j.generated), repos: j.repos || {}, today: j.today, heartbeat: j.heartbeat, actions: j.actions || [], vault: j.vault };
  } catch { return null; }
}
async function loadRegistry(){
  const r = await fetch("registry.json", { cache:"no-cache" });
  const j = await r.json();
  AGENTS = j.agents; REG = { schedule: j.schedule || [], todos: j.todos || [] };
}

/* ── 관제: 조치 필요 + 오늘 일정(운행표) ── */
const hm = d => kst(d, { hour:"2-digit", minute:"2-digit", hour12:false });
const ACT_TOP = 5;
let actAll = false;
function fmtIn(ms){                       // 남은 시간: "13시간 40분 뒤"
  const m = Math.max(1, Math.round(ms / 60000));
  if (m >= 180) return `${Math.round(m / 60)}시간 뒤`;
  return (m >= 60 ? `${Math.floor(m / 60)}시간 ` : "") + (m % 60 ? `${m % 60}분 ` : "") + "뒤";
}
function renderOps(){
  const items = [];
  const fresh = CENTRAL && Date.now() - CENTRAL.t < CENTRAL_MAX_AGE;
  if (CENTRAL && !fresh) items.push({ level:"error", title:`상태 자동 수집 멈춤 (마지막 ${fmtAgo(new Date(CENTRAL.t))})`, detail:"GH 디스패처 또는 허브 상태 갱신 워크플로 확인", url:`https://github.com/${OWNER}/agent-hub/actions` });
  if (fresh) items.push(...CENTRAL.actions);
  const todayKey = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
  for (const t of REG.todos) if (!t.until || todayKey < t.until) items.push({ level:"todo", ...t });
  const order = { error:0, warn:1, todo:2 };
  items.sort((a, b) => (order[a.level] ?? 3) - (order[b.level] ?? 3));          // 오류 → 주의 → 직접 할 일
  const nBad = items.filter(x => x.level === "error").length, jobs = fresh ? CENTRAL.today?.jobs || [] : [], nDone = jobs.filter(j => j.state === "done").length;
  const count = $("#actCount"); count.textContent = items.length ? items.length : ""; count.className = nBad ? "bad" : "";
  $("#opsSum").innerHTML = `조치 필요 <b class="${nBad ? "bad" : ""}">${items.length}</b> · 오늘 일정 <b>${nDone}/${jobs.length}</b> 완료`;
  const shown = actAll ? items : items.slice(0, ACT_TOP);
  $("#actions").innerHTML = (items.length ? shown.map(x => {
    const dot = x.level === "error" ? "err" : x.level === "warn" ? "warn" : "todo";
    const tag = x.level === "todo" ? `<span class="pill">직접</span>` : "";
    const body = `<i class="dot ${dot}"></i><span class="w">${tag}${esc(x.title)}${x.detail ? `<small>${esc(x.detail)}</small>` : ""}</span>`;
    return `<li>${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${body}</a>` : `<div>${body}</div>`}</li>`;
  }).join("") : `<li class="ok"><div><i class="dot run"></i><span class="w">조치할 항목이 없습니다</span></div></li>`)
    + (items.length > ACT_TOP ? `<li><button class="more" id="actMore">${actAll ? "접기" : `나머지 ${items.length - ACT_TOP}건 보기`}</button></li>` : "");

  // 운행표: 예정 시각 · 작업 · 실제 시각 · 지연(+3분). '지금' 선이 지난 것과 남은 것을 가른다.
  const date = CENTRAL?.today?.date;
  $("#todayLbl").textContent = date ? kst(new Date(date + "T12:00:00+09:00"), { month:"numeric", day:"numeric", weekday:"short" }) : "";
  const now = Date.now();
  const tOf = j => Date.parse(`${date}T${j.at}:00+09:00`);
  const nextIdx = jobs.findIndex(j => tOf(j) > now && (j.state === "wait" || j.state === "due"));
  const nowRow = `<li class="now"><div><span>지금 ${hm(new Date(now))}</span></div></li>`;
  const line = (j, k) => {
    const t = tOf(j), run = j.runAt ? Date.parse(j.runAt) : null, late = run ? Math.floor((run - t) / 60000) : null;
    const dly = j.state === "fail" ? "실패" : j.state === "missed" ? "미실행" : j.state === "run" ? "실행 중"
      : j.state === "done" ? (late > 0 ? `+${late}분` : "정시") : j.state === "unknown" ? "확인 불가" : k === nextIdx ? fmtIn(t - now) : "예정";
    const body = `<time>${esc(j.at)}</time><span class="w">${esc(j.name)}</span><span class="at">${run ? hm(new Date(run)) : "—"}</span><span class="dly">${dly}</span>`;
    return (k === nextIdx ? nowRow : "") + `<li class="${j.state}${k === nextIdx ? " next" : ""}">${j.url ? `<a href="${esc(j.url)}" target="_blank" rel="noopener">${body}</a>` : `<div>${body}</div>`}</li>`;
  };
  $("#today").innerHTML = jobs.length
    ? `<li class="hd"><div><span>예정</span><span>작업</span><span>실제</span><span>지연</span></div></li>` + jobs.map(line).join("") + (nextIdx < 0 ? nowRow : "")
    : `<li class="none"><div>${CENTRAL ? (fresh ? (CENTRAL.today ? "오늘 예정된 작업이 없습니다" : "일정 수집 대기 중 (다음 상태 갱신 때 표시)") : "자동 수집 기록이 오래되어 표시하지 않습니다") : "불러오는 중"}</div></li>`;
}

async function refresh(force){
  $("#refresh").classList.add("spin");
  const central = await loadCentral(force);
  CENTRAL = central;
  const fresh = central && Date.now() - central.t < CENTRAL_MAX_AGE;
  // 비공개 저장소는 방문자 브라우저에서 직접 조회할 수 없으므로 자동 수집 기록만 쓴다.
  await Promise.all(AGENTS.filter(a => a.repo && (!a.private || central?.repos[a.repo])).map(async a => {
    const c = central?.repos[a.repo];
    if (c && fresh) DATA[a.repo] = { ...c, t: central.t };
    else {
      const d = await loadRepo(a, force);
      DATA[a.repo] = c && d.error ? { ...c, t: central.t, stale: "자동 수집 기록이 오래됨" } : { ...d, stale: d.stale || "자동 결과 점검 미확인 · 실행 기록만 조회됨" };
    }
    render();
  }));
  $("#refresh").classList.remove("spin");
  const errs = Object.values(DATA).filter(d => d.error || d.stale).length;
  const ts = Object.values(DATA).map(d => d.t).filter(Boolean);
  const at = ts.length ? new Date(Math.min(...ts)) : new Date();
  $("#updated").textContent = `상태 ${kst(at, { hour:"2-digit", minute:"2-digit", hour12:false })} 기준` + (errs ? ` · ${errs}개 불러오기 실패` : "");
}

/* ── 이벤트 ── */
function setView(v){
  view = v;
  document.querySelectorAll("#viewToggle button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v));
  try { localStorage.setItem("hub:view", v); } catch {}
  render();
}
$("#viewToggle").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setView(b.dataset.v); });
$("#statusFilter").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll("#statusFilter button").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});
$("#actions").addEventListener("click", e => { if (e.target.closest("#actMore")) { actAll = !actAll; renderOps(); } });
$("#cats").addEventListener("click", e => {
  const b = e.target.closest("[data-cat]"); if (!b) return;
  cat = b.dataset.cat;
  try { localStorage.setItem("hub:cat", cat); } catch {}
  render();
});
$("#q").addEventListener("input", render);
$("#refresh").addEventListener("click", () => refresh(true));
$("#scrim").addEventListener("click", closePanel);
$("#panel").addEventListener("click", e => {
  if (e.target.closest("#closePanel")) return closePanel();
  const o = e.target.closest("[data-open]"); if (o) openAgent(AGENTS[+o.dataset.open]);
});
// 휴대폰: 카드를 누르면 바로 열기, ⋯ 버튼은 상세 시트. PC: 카드를 누르면 상세 패널
function activate(k){
  const a = AGENTS[k];
  if (mq.matches && a.type !== "local") openAgent(a); else openPanel(k);
}
$("#view").addEventListener("click", e => {
  const o = e.target.closest("[data-open]"); if (o) return openAgent(AGENTS[+o.dataset.open]);
  const m = e.target.closest("[data-info]"); if (m) return openPanel(+m.dataset.info);
  if (e.target.closest("a,button")) return;
  const c = e.target.closest("[data-k]"); if (c) activate(+c.dataset.k);
});
$("#view").addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.target.closest("a,button")) return;
  const c = e.target.closest("[data-k]"); if (c) activate(+c.dataset.k);
});
window.addEventListener("popstate", () => closePanel(true));
mq.addEventListener("change", () => { closePanel(true); render(); });
document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA/.test(document.activeElement.tagName);
  if (e.key === "Escape"){ if (typing) document.activeElement.blur(); else closePanel(); return; }
  if (e.key === "/" && !typing){ e.preventDefault(); $("#q").focus(); return; }
});

if (mq.matches) $("#opsBox").open = false;   // 휴대폰에서는 한 줄로 접어 두고, 누르면 펼친다
loadRegistry().then(() => { setView(view); refresh(false); })
  .catch(e => { $("#updated").textContent = "등록부(registry.json)를 불러오지 못했습니다"; console.error(e); });
setInterval(render, 60 * 1000);   // '몇 분 전'·다음 실행 표시 갱신
</script>
</body>
</html>
